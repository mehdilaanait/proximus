<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mobile Traffic Dashboard — POC</title>
<style>
:root{
  color-scheme:light;
  --bg:#f4f3f0; --surface-1:#fcfcfb; --border:#e4e2dc;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#8a8984;
  --grid:#ebe9e4; --neutral-bar:#c9c7c0; --accent:#5b2d90;
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100; --series-5:#e87ba4; --series-6:#008300; --series-7:#6250d6; --series-8:#e34948;
  --good:#006300; --bad:#c12f2f;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark; --bg:#111110; --surface-1:#1a1a19; --border:#2e2e2b;
    --text-primary:#f0efec; --text-secondary:#c3c2b7; --text-muted:#8d8c85; --grid:#2a2a27; --neutral-bar:#4a4a46; --accent:#b49be6;
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500; --series-5:#d55181; --series-6:#008300; --series-7:#9085e9; --series-8:#e66767;
    --good:#4cc24c; --bad:#ef7070;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark; --bg:#111110; --surface-1:#1a1a19; --border:#2e2e2b;
  --text-primary:#f0efec; --text-secondary:#c3c2b7; --text-muted:#8d8c85; --grid:#2a2a27; --neutral-bar:#4a4a46; --accent:#b49be6;
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500; --series-5:#d55181; --series-6:#008300; --series-7:#9085e9; --series-8:#e66767;
  --good:#4cc24c; --bad:#ef7070;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text-primary);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
.top{position:sticky;top:0;z-index:5;background:var(--surface-1);border-bottom:1px solid var(--border)}
.bar1{display:flex;align-items:center;gap:16px;padding:14px 28px 6px;flex-wrap:wrap}
.logo{height:34px;width:auto;display:block}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px;margin-bottom:16px}
.grid3 .card{margin-bottom:0}
.bar1 h1{font-size:19px;margin:0;font-weight:650;letter-spacing:-.01em}
.badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;border:1px solid var(--border);color:var(--text-secondary);text-transform:uppercase;letter-spacing:.04em}
.spacer{flex:1}
.ctrl{display:flex;align-items:center;gap:8px;color:var(--text-secondary);font-size:13px}
select,button.ghost{font:inherit;color:var(--text-primary);background:var(--surface-1);border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer}
#tabs{display:flex;gap:2px;padding:0 20px;overflow-x:auto}
.tab{font:inherit;background:none;border:0;border-bottom:2px solid transparent;padding:10px 10px 9px;color:var(--text-secondary);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--text-primary)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
main{padding:22px 28px 60px;max-width:1500px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.kpi-l{font-size:12.5px;color:var(--text-secondary)}
.kpi-v{font-size:26px;font-weight:650;letter-spacing:-.02em;margin:2px 0}
.kpi-d{font-size:12px}
.kpi-s{font-size:12px;color:var(--text-muted);margin-top:2px}
.muted{color:var(--text-muted)}
.delta{font-weight:600;white-space:nowrap;font-size:12px}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)} .delta.flat{color:var(--text-muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(460px,1fr));gap:16px;margin-bottom:16px}
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:16px 18px;min-width:0;margin-bottom:16px}
.grid2 .card{margin-bottom:0}
.card header{margin-bottom:10px}
.card h3{margin:0;font-size:15px;font-weight:620}
.card header p{margin:2px 0 0;font-size:12.5px;color:var(--text-secondary)}
h2.sec{font-size:17px;margin:26px 0 12px;font-weight:650}
svg{display:block;overflow:visible}
svg text{font-family:inherit}
.grid{stroke:var(--grid);stroke-width:1}
.axis{fill:var(--text-muted);font-size:11px}
.lab{fill:var(--text-secondary);font-size:12.5px}
.val{fill:var(--text-primary);font-size:12px;font-weight:600}
.xh{stroke:var(--text-muted);stroke-width:1;stroke-dasharray:3 3}
.bar{transition:opacity .12s}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--text-secondary);margin:0 0 8px}
.legend b{color:var(--text-primary);font-weight:600}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tip{position:fixed;display:none;pointer-events:none;z-index:50;background:var(--surface-1);color:var(--text-primary);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 6px 20px rgba(0,0,0,.14);min-width:160px}
.tip b{display:block;margin-bottom:4px}
.tip div{display:flex;align-items:center;gap:4px}
.tip div span{margin-left:auto;padding-left:14px;font-weight:600}
.tt-total{border-top:1px solid var(--border);margin-top:4px;padding-top:4px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;color:var(--text-secondary);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap;user-select:none}
th.sorted{color:var(--text-primary)}
td{padding:8px 10px;border-bottom:1px solid var(--grid);white-space:nowrap}
tbody tr:hover td{background:color-mix(in srgb,var(--series-1) 6%,transparent)}
tfoot td{font-weight:650;border-top:1px solid var(--border);border-bottom:0}
.num{text-align:right}
.cellbar{display:flex;align-items:center;gap:8px;min-width:150px}
.cellbar i{flex:1;display:block;height:8px}
.cellbar span{display:block;height:8px;border-radius:0 4px 4px 0;background:color-mix(in srgb,var(--series-1) 40%,transparent)}
.cellbar em{font-style:normal;min-width:62px;text-align:right}
.segbar{display:flex;gap:2px;height:28px;border-radius:6px;overflow:hidden;margin:6px 0 12px}
.segbar div:last-child{border-radius:0 6px 6px 0}
.callout{background:var(--surface-1);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:10px;padding:14px 18px;margin-bottom:16px}
.callout ol{margin:8px 0 0;padding-left:20px} .callout li{margin:3px 0}
.callout.small{font-size:13px;color:var(--text-secondary)}
.note{font-size:12px;color:var(--text-muted);margin:10px 0 0}
.filters{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filters label{font-size:13px;color:var(--text-secondary);margin-right:4px}
.chip{font:inherit;font-size:13px;border:1px solid var(--border);background:var(--surface-1);color:var(--text-secondary);border-radius:99px;padding:5px 12px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.defs dt{font-weight:600;margin-top:10px} .defs dd{margin:2px 0 0;color:var(--text-secondary)}

.fbar{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;padding:10px 28px;border-top:1px solid var(--border);background:var(--bg);font-size:13px}
.fl{display:flex;align-items:center;gap:6px;color:var(--text-secondary)}
.fl select{padding:5px 8px}
.off{opacity:.45;pointer-events:none}
.fl-note{font-size:12px}
.small{font-size:12.5px;padding:4px 10px}
.dd{position:relative}
.dd summary{list-style:none;cursor:pointer;border:1px solid var(--border);background:var(--surface-1);border-radius:8px;padding:5px 10px;color:var(--text-secondary)}
.dd summary::-webkit-details-marker{display:none}
.dd summary::after{content:' ▾'}
.dd summary b{color:var(--text-primary);font-weight:600}
.dd-panel{position:absolute;top:calc(100% + 6px);left:0;z-index:20;background:var(--surface-1);border:1px solid var(--border);border-radius:10px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.14);min-width:230px;display:flex;flex-direction:column;gap:6px}
.dd-panel label{display:flex;gap:8px;align-items:center;cursor:pointer;color:var(--text-primary)}
.dd-act{display:flex;gap:8px;margin-bottom:4px}
.dd-act button{font:inherit;font-size:12px;border:0;background:none;color:var(--accent);cursor:pointer;padding:0}
.chip .sw{margin-right:6px}
.fn-title{font-weight:600;margin-bottom:6px}
.fn-sum{display:flex;gap:24px;flex-wrap:wrap;font-size:13px;color:var(--text-secondary);border-top:1px solid var(--grid);padding-top:10px;margin-top:4px}
.fn-sum b{color:var(--text-primary)}
.heat{display:inline-block;min-width:58px;padding:2px 6px;border-radius:4px}
.filters select{font:inherit;font-size:13px}
.onbar{fill:#fff;font-size:11.5px;font-weight:500}
code{font-size:12px;background:var(--bg);padding:1px 5px;border-radius:4px}
@media (max-width:700px){.grid2{grid-template-columns:1fr} main{padding:16px} .bar1{padding:12px 16px 4px}}
</style>
</head>

<script>
// ---------- Sample data generator (deterministic) ----------
const N = 52; // weeks
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd = mulberry32(20261030);
const noise = (amp) => 1 + (rnd()*2-1)*amp;

// week start dates (Mondays), last = 2026-10-19
const WEEKS = [];
{ const end = new Date(Date.UTC(2026,9,19)); for(let i=N-1;i>=0;i--){ const d=new Date(end); d.setUTCDate(d.getUTCDate()-7*i); WEEKS.push(d);} }
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WEEK_LABELS = WEEKS.map(d=>`${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}`);

// market seasonality: summer dip, Black Friday / Christmas peak (Nov-Dec 2025), smartphone launch (Sep 2026), Jan sales
const MARKET = WEEKS.map((d)=>{
  const m=d.getUTCMonth(), day=d.getUTCDate(); let f=1;
  if(m===6||(m===7&&day<20)) f*=0.88;
  if(m===10&&day>=20) f*=1.35; else if(m===10) f*=1.08;
  if(m===11&&day<22) f*=1.22; if(m===11&&day>=22) f*=0.9;
  if(m===0&&day<20) f*=1.05;
  if(m===8&&day>=8) f*=1.18; if(m===9&&day<10) f*=1.08;
  return f;
});
const PHONE_LAUNCH = WEEKS.map(d=>{const m=d.getUTCMonth(),day=d.getUTCDate(); return (m===8&&day>=8)||(m===9&&day<14)?1.5:1});

function series(base,{trend=0,amp=0.07,season=1,extra=null}={}){

function shape(n,amp,trend=0){ const w=[]; for(let i=0;i<n;i++) w.push((1+trend*i/n)*noise(amp)); const s=w.reduce((a,b)=>a+b,0); return w.map(v=>v/s); }

  const Ip = isNew?0:I/(1+di/100), Cp = isNew?0:C/(1+dc/100), posP = isNew?null:pos/(1+dpos/100);
  const w={impr:new Array(N).fill(0), clicks:new Array(N).fill(0), posW:new Array(N).fill(0)};
  const fill=(from,len,Itot,Ctot,p,trend)=>{ if(!Itot) return; const si=shape(len,0.08,trend), sc=si.map(v=>v*noise(0.06)); const scs=sc.reduce((a,b)=>a+b,0);

});

function delta(c,p,{inverse=false,pp=false}={}){
  if(p==null||!isFinite(p)||p===0) return '<span class="delta flat">–</span>';
  const d = pp? (c-p)*100 : (c/p-1)*100;
  const good = inverse? d<0 : d>0;
  const cls = Math.abs(d)<0.5?'flat':good?'up':'down';
  const arrow = d>0?'▲':d<0?'▼':'';
  return `<span class="delta ${cls}">${arrow} ${Math.abs(d).toLocaleString('en-GB',{minimumFractionDigits:1,maximumFractionDigits:1})}${pp?' pp':'%'}</span>`;
}

const SER = i=>`var(--series-${i})`;

// ---------- tooltip ----------
const tip = document.createElement('div'); tip.className='tip'; document.body.appendChild(tip);
function showTip(html,ev){ tip.innerHTML=html; tip.style.display='block'; const r=tip.getBoundingClientRect(); let x=ev.clientX+14, y=ev.clientY+14; if(x+r.width>innerWidth-8)x=ev.clientX-r.width-14; if(y+r.height>innerHeight-8)y=ev.clientY-r.height-14; tip.style.left=x+'px'; tip.style.top=y+'px'; }
function hideTip(){ tip.style.display='none'; }
const sw = c=>`<i class="sw" style="background:${c}"></i>`;

// ---------- charts ----------
function niceMax(v){ if(v<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
function legend(series){ return series.length<2?'':`<div class="legend">${series.map(s=>`<span>${sw(s.color)}${s.name}</span>`).join('')}</div>`; }

function lineChart(el, labels, series, fmt=fmtK, {h=240, yMin=null, yMaxFixed=null, invert=false}={}){
  const W = el.clientWidth||600, H=h, m={t:12,r:16,b:26,l:52};
  const all = series.flatMap(s=>s.values);
  let lo = yMin??0, hi = yMaxFixed??niceMax(Math.max(...all)*1.05);
  if(yMin!=null && yMaxFixed==null){ hi = Math.max(...all)*1.05; }
  const x = i=>m.l + (labels.length===1?0:i*(W-m.l-m.r)/(labels.length-1));
  const y = v=>{ const t=(v-lo)/(hi-lo); return invert? m.t + t*(H-m.t-m.b) : H-m.b - t*(H-m.t-m.b); };
  let g='';
  for(let k=0;k<=4;k++){ const v=lo+(hi-lo)*k/4, yy=y(v); g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${yy}" y2="${yy}" class="grid"/><text x="${m.l-8}" y="${yy+4}" class="axis" text-anchor="end">${fmt(v)}</text>`; }
  const step = Math.ceil(labels.length/ Math.max(2,Math.floor((W-m.l-m.r)/70)));
  labels.forEach((l,i)=>{ if(i%step===0) g+=`<text x="${x(i)}" y="${H-6}" class="axis" text-anchor="middle">${l}</text>`; });
  series.forEach(s=>{ const d=s.values.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(''); g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" ${s.dash?'stroke-dasharray="4 4"':''}/>`; });
  // end labels for <=4 series
  if(series.length>1 && series.length<=4){ series.forEach(s=>{ const i=s.values.length-1; g+=`<circle cx="${x(i)}" cy="${y(s.values[i])}" r="4" fill="${s.color}" stroke="var(--surface-1)" stroke-width="2"/>`; }); }
  g+=`<line class="xh" x1="0" x2="0" y1="${m.t}" y2="${H-m.b}" style="display:none"/>`;
  g+=`<g class="dots"></g><rect x="${m.l}" y="${m.t}" width="${W-m.l-m.r}" height="${H-m.t-m.b}" fill="transparent" class="hit"/>`;
  el.innerHTML = legend(series)+`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${g}</svg>`;
  const svg=el.querySelector('svg'), xh=svg.querySelector('.xh'), dots=svg.querySelector('.dots');
  svg.querySelector('.hit').addEventListener('mousemove',ev=>{
    const r=svg.getBoundingClientRect(); const px=ev.clientX-r.left; const i=Math.max(0,Math.min(labels.length-1,Math.round((px-m.l)/((W-m.l-m.r)/(labels.length-1||1)))));
    xh.setAttribute('x1',x(i)); xh.setAttribute('x2',x(i)); xh.style.display='';
    dots.innerHTML=series.map(s=>`<circle cx="${x(i)}" cy="${y(s.values[i])}" r="4.5" fill="${s.color}" stroke="var(--surface-1)" stroke-width="2"/>`).join('');
    showTip(`<b>${s0(labels[i])}</b>`+series.map(s=>`<div>${sw(s.color)}${s.name}<span>${fmt(s.values[i])}</span></div>`).join(''),ev);
  });
  svg.querySelector('.hit').addEventListener('mouseleave',()=>{xh.style.display='none';dots.innerHTML='';hideTip();});
}
const s0 = l=>'Week of '+l;

function hbar(el, rows, fmt=fmtK, {color=SER(1), labelW=170}={}){
  const W=el.clientWidth||500, rowH=30, H=rows.length*rowH+8, m={l:labelW,r:70};
  const mx=Math.max(...rows.map(r=>r.value))||1;
  let g='';
  rows.forEach((r,i)=>{ const y=i*rowH+6, w=Math.max(2,(W-m.l-m.r)*r.value/mx);
    g+=`<text x="${m.l-10}" y="${y+15}" class="lab" text-anchor="end">${r.label}</text>`;
    g+=`<path d="M${m.l},${y+3} h${w-4} a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h${-(w-4)} z" fill="${r.color||color}" class="bar" data-i="${i}"/>`;
    g+=`<text x="${m.l+w+8}" y="${y+15}" class="val">${fmt(r.value)}</text>`;
    g+=`<rect x="0" y="${y}" width="${W}" height="${rowH-2}" fill="transparent" class="hitbar" data-i="${i}"/>`;
  });
  el.innerHTML=`<svg width="${W}" height="${H}">${g}</svg>`;
  el.querySelectorAll('.hitbar').forEach(b=>{ const r=rows[+b.dataset.i];
    b.addEventListener('mousemove',ev=>{ showTip(`<b>${r.label}</b><div>${r.tip||fmt(r.value)}</div>`,ev); el.querySelectorAll('.bar').forEach(x=>x.style.opacity=x.dataset.i===b.dataset.i?1:.45); });
    b.addEventListener('mouseleave',()=>{hideTip();el.querySelectorAll('.bar').forEach(x=>x.style.opacity=1);});
  });
}

function stackedCols(el, labels, series, fmt=fmtK, {h=240}={}){
  const W=el.clientWidth||600, H=h, m={t:12,r:12,b:26,l:52};
  const totals=labels.map((_,i)=>sum(series.map(s=>s.values[i])));
  const hi=niceMax(Math.max(...totals)*1.04);
  const bw=(W-m.l-m.r)/labels.length, barW=Math.max(3,bw-3);
  const y=v=>H-m.b-v/hi*(H-m.t-m.b);
  let g='';
  for(let k=0;k<=4;k++){ const v=hi*k/4,yy=y(v); g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${yy}" y2="${yy}" class="grid"/><text x="${m.l-8}" y="${yy+4}" class="axis" text-anchor="end">${fmt(v)}</text>`; }
  const step=Math.ceil(labels.length/Math.max(2,Math.floor((W-m.l-m.r)/70)));
  labels.forEach((l,i)=>{ const x0=m.l+i*bw+(bw-barW)/2; let acc=0;
    series.forEach((s,si)=>{ const v=s.values[i]; const y1=y(acc+v), y0=y(acc); const hh=Math.max(0,y0-y1-(si?2:0));
      if(si===series.length-1){ const r=Math.min(3,barW/2,hh); g+=`<path d="M${x0},${y0-(si?2:0)} v${-(hh-r)} a${r},${r} 0 0 1 ${r},${-r} h${barW-2*r} a${r},${r} 0 0 1 ${r},${r} v${hh-r} z" fill="${s.color}"/>`; }
      else g+=`<rect x="${x0}" y="${y1}" width="${barW}" height="${hh}" fill="${s.color}"/>`;
      acc+=v; });
    if(i%step===0) g+=`<text x="${x0+barW/2}" y="${H-6}" class="axis" text-anchor="middle">${l}</text>`;
    g+=`<rect x="${m.l+i*bw}" y="${m.t}" width="${bw}" height="${H-m.t-m.b}" fill="transparent" class="hitc" data-i="${i}"/>`;
  });
  el.innerHTML=legend(series)+`<svg width="${W}" height="${H}">${g}</svg>`;
  el.querySelectorAll('.hitc').forEach(b=>{ const i=+b.dataset.i;
    b.addEventListener('mousemove',ev=>showTip(`<b>${s0(labels[i])}</b>`+series.slice().reverse().map(s=>`<div>${sw(s.color)}${s.name}<span>${fmt(s.values[i])}</span></div>`).join('')+`<div class="tt-total">Total<span>${fmt(totals[i])}</span></div>`,ev));
    b.addEventListener('mouseleave',hideTip);
  });
}

function segBar(el, segs, fmt=v=>fmtPct(v,0)){
  el.innerHTML=`<div class="segbar">${segs.map(s=>`<div style="flex:${s.value};background:${s.color}" data-t="${s.label}: ${fmt(s.value)}"></div>`).join('')}</div>
  <div class="legend">${segs.map(s=>`<span>${sw(s.color)}${s.label} <b>${fmt(s.value)}</b></span>`).join('')}</div>`;
  el.querySelectorAll('.segbar div').forEach(d=>{d.addEventListener('mousemove',ev=>showTip(d.dataset.t,ev));d.addEventListener('mouseleave',hideTip);});
}

// sortable table
function table(el, cols, rows, {sortKey=null, desc=true, foot=null}={}){
  let sk=sortKey, sd=desc;
  function draw(){
    const rs = sk==null?rows:rows.slice().sort((a,b)=>{const va=a[sk],vb=b[sk]; if(typeof va==='string') return sd?vb.localeCompare(va):va.localeCompare(vb); return sd?(vb??-1e18)-(va??-1e18):(va??1e18)-(vb??1e18);});
    el.innerHTML=`<div class="tbl-wrap"><table><thead><tr>${cols.map(c=>`<th class="${c.num?'num':''} ${c.key===sk?'sorted':''}" data-k="${c.key}">${c.label}${c.key===sk?(sd?' ↓':' ↑'):''}</th>`).join('')}</tr></thead>
    <tbody>${rs.map(r=>`<tr>${cols.map(c=>`<td class="${c.num?'num':''}">${c.render?c.render(r):r[c.key]}</td>`).join('')}</tr>`).join('')}</tbody>
    ${foot?`<tfoot><tr>${cols.map(c=>`<td class="${c.num?'num':''}">${foot[c.key]??''}</td>`).join('')}</tr></tfoot>`:''}</table></div>`;
    el.querySelectorAll('th').forEach(th=>th.addEventListener('click',()=>{ const k=th.dataset.k; if(sk===k) sd=!sd; else {sk=k; sd=true;} draw(); }));
  }
  draw();
}
const barCell = (v,mx,txt)=>`<div class="cellbar"><i><span style="width:${Math.max(1,v/mx*100)}%"></span></i><em>${txt}</em></div>`;

function kpi(label, value, deltaHtml, sub=''){ return `<div class="kpi"><div class="kpi-l">${label}</div><div class="kpi-v">${value}</div><div class="kpi-d">${deltaHtml} <span class="muted">vs prev. period</span></div>${sub?`<div class="kpi-s">${sub}</div>`:''}</div>`; }
const card = (id,title,sub='',cls='')=>`<section class="card ${cls}"><header><h3>${title}</h3>${sub?`<p>${sub}</p>`:''}</header><div id="${id}"></div></section>`;


// ---------- filter layer ----------
const RAW = {CHANNELS,SOCIAL,DISPLAY,SEARCH,KEYWORDS,PLANS,PHONE_OBJS,OPTIONS,FAMILY,SEO_GROUPS,ORG_SOCIAL};
const FILTER = {channels:new Set(CHANNELS.map(c=>c.id)), device:'all', lang:'all'};
const DEV = {all:[1,1,1], mobile:[.68,.52,.71], desktop:[.27,.42,.24], tablet:[.05,.06,.05]};
const LANG = {all:[1,1,1], nl:[.58,.6,.57], fr:[.38,.37,.39], en:[.04,.03,.04]};
const NOSCALE = new Set(['is','pos','orgPos','followers','posts','reach','engagements','linkClicks']);
const kindOf = k => /^(cto|checkout|orders|withSub|identify|overview)$/.test(k)?1 : /^(spend|cost|paidCost)$/.test(k)?2 : 0;
function fac(kind,i){ const d=DEV[FILTER.device][kind]*LANG[FILTER.lang][kind]; if(d===1) return 1; return d*(1+0.035*Math.sin(i*1.37+kind*2+(FILTER.device.length+FILTER.lang.length))); }
function scaleArr(arr,k,extra){ const kind=kindOf(k); return arr.map((v,i)=>v*fac(kind,i)*(extra?extra[i]:1)); }
function scaleW(w,{skip=[],extra=null}={}){ const o={}; for(const k in w){ o[k]= (NOSCALE.has(k)||skip.includes(k))? w[k].slice() : scaleArr(w[k],k,extra); } return o; }
const cloneList = (list,opt)=>list.map(o=>({...o, w: Array.isArray(o.w)? scaleArr(o.w,'orders',opt&&opt.extra) : scaleW(o.w,opt)}));
const V = {};
function applyFilters(){
  // NB: organic social reach/engagement are platform metrics and are not split by device/language
  V.CHANNELS_ALL = cloneList(RAW.CHANNELS);
  V.CHANNELS = V.CHANNELS_ALL.filter(c=>FILTER.channels.has(c.id));
  const tot = list=>{ const t={}; ['sessions','cto','orders','spend','productViews','checkout'].forEach(k=>{ t[k]=WEEKS.map((_,i)=>list.reduce((s,c)=>s+c.w[k][i],0)); }); return t; };
  V.TOTAL = tot(V.CHANNELS); V.TOTAL_ALL = tot(V.CHANNELS_ALL);
  const ratio = WEEKS.map((_,i)=>div0(V.TOTAL.orders[i],V.TOTAL_ALL.orders[i]));
  V.paidCh = V.CHANNELS_ALL.find(c=>c.id==='paid_search'); V.orgCh = V.CHANNELS_ALL.find(c=>c.id==='organic');
  V.SOCIAL = cloneList(RAW.SOCIAL); V.DISPLAY = cloneList(RAW.DISPLAY);
  V.SEARCH = scaleW(RAW.SEARCH); V.KEYWORDS = cloneList(RAW.KEYWORDS);
  V.PLANS = cloneList(RAW.PLANS,{extra:ratio}); V.PHONE_OBJS = cloneList(RAW.PHONE_OBJS,{extra:ratio});
  V.OPTIONS = cloneList(RAW.OPTIONS,{extra:ratio}); V.FAMILY = cloneList(RAW.FAMILY,{extra:ratio});
  V.SEO = cloneList(RAW.SEO_GROUPS); V.ORG_SOCIAL = cloneList(RAW.ORG_SOCIAL);
}
const CH_COLOR = {}; ['paid_search','organic','social','direct','email'].forEach((id,i)=>CH_COLOR[id]=SER(i+1));

// ---------- aggregates ----------
function agg(w){ const o={},p={}; for(const k in w){ o[k]=sum(cur(w[k])); p[k]=sum(prev(w[k])); } return [o,p]; }

  const rows=V.CHANNELS.map(ch=>{const [a,b]=agg(ch.w); return {name:ch.name,group:ch.group,sessions:a.sessions,cto:a.cto,orders:a.orders,cr:div0(a.orders,a.sessions),close:div0(a.orders,a.cto),spend:a.spend||null,cpo:a.spend?a.spend/a.orders:null,dOrders:div0(a.orders,b.orders)-1,_p:b};});

}

let FN_MODE='subscriptions', FN_ITEM='all';
const FN_STEPS=[['views','Product page'],['cto','Composer'],['identify','Identify'],['overview','Overview'],['orders','Confirmation']];
function fnItems(type){ return type==='subscriptions'? V.PLANS.map(p=>({id:p.name,label:p.name,w:p.w})) : V.PHONE_OBJS.map(p=>({id:p.model,label:`${p.brand} ${p.model}`,brand:p.brand,w:p.w})); }
function fnSeries(type,item){ let its=fnItems(type); if(item&&item!=='all') its=its.filter(x=>x.id===item||x.brand===item); const o={}; FN_STEPS.forEach(([k])=>o[k]=WEEKS.map((_,i)=>sum(its.map(x=>x.w[k][i])))); return o; }
function funnelBlock(el,type,item,title){
  const s=fnSeries(type,item); const c=FN_STEPS.map(([k])=>sum(cur(s[k]))), p=FN_STEPS.map(([k])=>sum(prev(s[k])));
  const W=el.clientWidth||600, rowH=58, H=FN_STEPS.length*rowH, lw=120, maxW=W-lw-150;
  let g='';
  FN_STEPS.forEach(([k,l],i)=>{ const w=i?Math.max(3,maxW*0.8*c[i]/c[1]):maxW, y=i*rowH+8, x=lw+(maxW-w)/2;
    g+=`<text x="${lw-12}" y="${y+22}" class="lab" text-anchor="end">${l}</text>`;
    g+=`<rect x="${x}" y="${y+6}" width="${w}" height="26" rx="4" fill="${type==='subscriptions'?SER(1):SER(7)}" class="bar" data-i="${i}"/>`;
    if(!i) g+=`<text x="${lw+maxW/2}" y="${y+24}" text-anchor="middle" class="onbar">not to scale — later steps are scaled to Composer</text>`;
    g+=`<text x="${lw+maxW+12}" y="${y+18}" class="val">${fmtInt(c[i])}</text><text x="${lw+maxW+12}" y="${y+33}" class="axis">${i?fmtPct(c[i]/c[i-1],1)+' of prev.':'100%'}</text>`;
    if(i) g+=`<text x="${lw+maxW/2}" y="${y+2}" class="axis" text-anchor="middle">▼ drop-off ${fmtInt(c[i-1]-c[i])} (${fmtPct(1-c[i]/c[i-1],1)})</text>`;
    g+=`<rect x="0" y="${y}" width="${W}" height="${rowH-6}" fill="transparent" class="hitbar" data-i="${i}"/>`; });
  el.innerHTML=(title?`<div class="fn-title">${title}</div>`:'')+`<svg width="${W}" height="${H}">${g}</svg>
   <div class="fn-sum"><span>Product page → Confirmation <b>${fmtPct(c[4]/c[0],2)}</b> ${delta(c[4]/c[0],p[4]/p[0],{pp:true})}</span><span>Composer → Confirmation <b>${fmtPct(c[4]/c[1],1)}</b> ${delta(c[4]/c[1],p[4]/p[1],{pp:true})}</span></div>`;
  el.querySelectorAll('.hitbar').forEach(b=>{const i=+b.dataset.i; b.addEventListener('mousemove',ev=>showTip(`<b>${FN_STEPS[i][1]}</b><div>Volume<span>${fmtInt(c[i])}</span></div>${i?`<div>Step conversion<span>${fmtPct(c[i]/c[i-1],1)}</span></div>`:''}<div>From product page<span>${fmtPct(c[i]/c[0],2)}</span></div><div>Prev. period<span>${fmtInt(p[i])}</span></div>`,ev)); b.addEventListener('mouseleave',hideTip);});
  return {s,c,p};
}

function render(){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.t===ACTIVE));
  const s=WEEKS[N-PERIOD], e=new Date(WEEKS[N-1]); e.setUTCDate(e.getUTCDate()+6);
  const f=d=>`${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
  $('#range').textContent=`${f(s)} – ${f(e)}`;
  filterBar();
  if(CH_SCOPE.has(ACTIVE)&&FILTER.channels.size===0){ $('#main').innerHTML='<div class="callout">No channel selected — pick at least one channel in the filter bar.</div>'; return; }
  RENDER[ACTIVE]($('#main'));
}
document.addEventListener('click',e=>{const d=document.querySelector('#fbar .dd'); if(!e.target.isConnected) return; if(d&&d.open&&!d.contains(e.target)) d.open=false;});
document.addEventListener('DOMContentLoaded',()=>{
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<button class="tab" data-t="${k}">${l}</button>`).join('');
  $('#tabs').addEventListener('click',e=>{const b=e.target.closest('.tab'); if(b){ACTIVE=b.dataset.t; render(); scrollTo(0,0);}});
  $('#theme').addEventListener('click',()=>{const d=document.documentElement; const dark=d.dataset.theme==='dark'||(!d.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches); d.dataset.theme=dark?'light':'dark'; render();});
  applyFilters(); render();
  let to; addEventListener('resize',()=>{clearTimeout(to);to=setTimeout(render,150);});
});

</script>
</body>
</html>
